<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Sharu ♡</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;1,400&family=Caveat:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<linearGradient id="pg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffe08a"/><stop offset=".22" stop-color="#ff8fbd"/><stop offset=".7" stop-color="#ffcfe2"/><stop offset="1" stop-color="#fff"/></linearGradient>
<symbol id="lily" viewBox="-50 -50 100 100">
<g fill="url(#pg)" stroke="#ff8fb3" stroke-width=".6">
<path id="pt" d="M0 0C-15-12-15-36 0-48 15-36 15-12 0 0Z" transform="rotate(30)"/>
<use href="#pt" transform="rotate(120)"/><use href="#pt" transform="rotate(240)"/>
<path d="M0 0C-17-12-17-36 0-48 17-36 17-12 0 0Z"/>
<path d="M0 0C-17-12-17-36 0-48 17-36 17-12 0 0Z" transform="rotate(120)"/>
<path d="M0 0C-17-12-17-36 0-48 17-36 17-12 0 0Z" transform="rotate(240)"/>
</g>
<g stroke="#e0508a" stroke-width=".7" opacity=".55" fill="none"><path d="M0-4V-36"/><path d="M0-4V-36" transform="rotate(120)"/><path d="M0-4V-36" transform="rotate(240)"/></g>
<g stroke="#f4a63a" stroke-width="1" fill="#e6862a">
<path d="M0 0L0-22M0 0L19 11M0 0L-19 11M0 0L10-19M0 0L-10-19M0 0L10 19" fill="none"/>
<circle cx="0" cy="-22" r="2.2"/><circle cx="19" cy="11" r="2.2"/><circle cx="-19" cy="11" r="2.2"/><circle cx="10" cy="-19" r="2"/><circle cx="-10" cy="-19" r="2"/><circle cx="10" cy="19" r="2"/>
</g>
<circle r="3" fill="#ffd27a"/>
</symbol>
<symbol id="hrt" viewBox="0 0 32 29"><path d="M16 28C-6 12 4-4 16 6 28-4 38 12 16 28Z" fill="#ff5c8a"/></symbol>
</defs>
</svg>

<div id="drift"></div>

<button id="back" type="button" aria-label="Back to home screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
<section class="screen" id="landing">
  <div class="lcard">
    <h1 class="hello" id="hello" aria-label="Hello, Sharannya ♡"></h1>
    <button class="lb p" id="goLily">Lilies for Sharu</button>
    <button class="lb s" id="which">Which one is it Sharu?</button>
    <button class="lb s z" id="surp">Happy Diwali Sharannya ♡</button>
  </div>
</section>
<main class="screen" id="login">
  <svg class="badge"><use href="#lily"/></svg>
  <h1 class="script">Hi Sharu</h1>
  <p class="sub">Enter our secret 3-digit code</p>
  <div class="dots" id="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
  <div class="pad" id="pad"></div>
  <div class="hint">HINT · something you already know ♡</div>
</main>

<div class="screen" id="bloom" style="display:none"></div>

<section id="home" class="screen">
  <p class="lead script">Cuz you like lilies… 🌸</p>
  <h2 class="name script" id="nm"></h2>
  <div class="hh">❤️</div>
  <div class="photos">
    <figure><img src="assets/images/home-lilies-pink.jpg" alt="Pink lilies"></figure>
    <figure class="lo"><img src="assets/images/home-lilies-white.jpg" alt="White lilies"></figure>
  </div>
  <div class="mq" id="mq"></div>
  <button class="love" id="lb">Tap if this made you smile 😊</button>
</section>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/fireworks.js"></script>
<script src="js/reminder.js"></script>
</body>
</html>
